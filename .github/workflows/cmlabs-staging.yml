name: staging-deployment

on:
  push:
    branches: [ develop ]

jobs:
  laravel-deploy:

    runs-on: ubuntu-latest
    steps:
      - name: SSH remote command executer
        # You may pin to the exact commit or the version.
        uses: tarunjangra/ssh-remote-cmd@v1
        with:
          # Command to execute on the remote server.
          command: |
            cd /home/dev/server-code/external/chandra/cdi-be
            sudo chown dev:www-data -R ./
            git stash
            git stash clear
            git pull origin develop
            rm -rf package-lock.json composer.lock
            php8.2 /usr/local/bin/composer install
            . ~/.nvm/nvm.sh
            nvm exec v22.17.1 npm install
            nvm exec v22.17.1 npm run build
            php artisan queue:restart
            php artisan cache:clear 
            php artisan route:clear
            php artisan config:clear
            php artisan view:clear
            sudo -S chmod 775 -R storage public bootstrap/cache
            ${{secrets.HOST_PASS}}
          # Hostname or IP address of the server.
          host: ${{secrets.HOST_ADDRESS}}
          # Username for authentication to server.
          user: ${{secrets.HOST_USER}}
          # Port number of the server.
          port: 22
          # File Location or string that contains a private key for either key-based or hostbased user authentication (OpenSSH format)
          key: ${{secrets.PRIVATE_KEY}}
          # Password for authentication.
          pass: ${{secrets.HOST_PASS}}
          
      - name: Google Chat Notification
        uses: Co-qn/google-chat-notification@releases/v1
        with:
          name: cdi-be (Staging) Deployment
          url: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          status: ${{ job.status }}
          if: always()
